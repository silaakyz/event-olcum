services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-olcum-app
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/app?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: event-olcum-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: event-olcum-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    dns:
      - 8.8.8.8
      - 1.1.1.1
    restart: unless-stopped

volumes:
  postgres_data:
